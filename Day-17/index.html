<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-17</title>

    <link rel="stylesheet" href="./assets/css/style.css">

</head>

<body>

    <div class="container">

        <div class="top-btns">
            <button class="active" onclick="showForm('login')">Login</button>
            <button onclick="showForm('signup')">Signup</button>
        </div>

        <form id="loginForm" class="active">
            <div class="input-box">
                <input type="email" id="loginEmail" placeholder="Email">
                <small id="loginEmailErr"></small>
            </div>

            <div class="input-box">
                <input type="password" id="loginPassword" placeholder="Password">
                <small id="loginPassErr"></small>
            </div>

            <button type="submit" class="submit-btn">Login</button>
            <div class="msg" id="loginMsg"></div>
        </form>

        <form id="signupForm">
            <div class="input-box">
                <input type="text" id="name" placeholder="Full Name">
                <small id="nameErr"></small>
            </div>

            <div class="input-box">
                <input type="email" id="email" placeholder="Email">
                <small id="emailErr"></small>
            </div>

            <div class="input-box">
                <input type="password" id="password" placeholder="Password">
                <small id="passErr"></small>
            </div>

            <div class="input-box">
                <input type="password" id="confirm" placeholder="Confirm Password">
                <small id="confirmErr"></small>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>
            <div class="msg" id="signupMsg"></div>
        </form>

        <div class="dashboard" id="dashboard">
            <h2>Welcome 🎉</h2>
            <p id="userText"></p>
            <button class="submit-btn logout" onclick="logout()">Logout</button>
        </div>

    </div>

    <script src="./assets/js/script.js"></script>

</body>

</html>
